name: Construire MelmaTech
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature permanente
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Un ou plusieurs secrets de signature Android sont manquants. Configure les quatre secrets dans GitHub."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/melmatech-signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/melmatech-signing/melmatech.jks"
          test -s "$RUNNER_TEMP/melmatech-signing/melmatech.jks"

      - name: Construire l'APK avec signature stable et version croissante
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/melmatech-signing/melmatech.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Renommer l'APK pour la distribution
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MelmaTech.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MelmaTech-${{ github.run_number }}.apk
          path: app/build/outputs/apk/debug/MelmaTech.apk
          if-no-files-found: error
